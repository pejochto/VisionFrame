<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-labelledby="sdTitle">
  <title id="sdTitle">SonarDepth</title>
  <!-- The product badge: a boat seen head on, the surface it sits on, and the
       beam going down from it. Drawn on the same black the site is drawn on,
       in the blue end of the VisionFrame ramp. -->
  <defs>
    <radialGradient id="sdDisc" cx="0.34" cy="0.24" r="0.92">
      <stop offset="0%" stop-color="#161a24"/>
      <stop offset="58%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="sdBlue" gradientUnits="userSpaceOnUse" x1="40" y1="20" x2="216" y2="240">
      <stop offset="0%" stop-color="#4d9bff"/>
      <stop offset="45%" stop-color="#1f74ee"/>
      <stop offset="100%" stop-color="#1440c8"/>
    </linearGradient>
  </defs>

  <!-- Disc -->
  <circle cx="128" cy="128" r="127.5" fill="#2b3140"/>
  <circle cx="128" cy="128" r="123" fill="url(#sdDisc)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#2a63dc" stroke-opacity="0.16" stroke-width="1"/>

  <g fill="none" stroke="url(#sdBlue)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bridge and hull -->
    <g stroke-width="12">
      <rect x="100" y="28" width="56" height="40" rx="10"/>
      <path d="M 34,72 L 222,72 L 186,110 C 168,124 88,124 70,110 Z"/>
    </g>

    <!-- Surface -->
    <g stroke-width="10">
      <path d="M 40,140 Q 62,127 84,140 Q 106,153 128,140 Q 150,153 172,140 Q 194,127 216,140"/>
      <path d="M 70,165 Q 89,153 108,165 Q 128,177 148,165 Q 167,153 186,165"/>

      <!-- Beam -->
      <path d="M 74,186 Q 128,210 182,186"/>
      <path d="M 92,208 Q 128,228 164,208"/>
      <path d="M 110,228 Q 128,241 146,228"/>
    </g>
  </g>
</svg>
