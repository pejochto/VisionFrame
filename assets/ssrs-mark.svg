<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="ssrsTitle">
  <title id="ssrsTitle">Swedish Sea Rescue Society</title>
  <!-- Emblem of the Swedish Sea Rescue Society (Sjöräddningssällskapet):
       a blue outer ring, a yellow inner ring, and a red cross on white with
       the initials S S R S set in the four quadrants. -->

  <!-- Rings, drawn as stroked circles so the widths stay even at any size. -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#0fa3dc" stroke-width="12"/>
  <circle cx="100" cy="100" r="81" fill="none" stroke="#ffe000" stroke-width="10"/>
  <circle cx="100" cy="100" r="76" fill="#ffffff"/>

  <!-- Cross pattée: arms 66 units long, flaring from 14 to 32 half-width. -->
  <path fill="#ed1b34" d="
    M 68 34 L 132 34
    Q 116 66 114 86
    Q 134 84 166 68
    L 166 132
    Q 134 116 114 114
    Q 116 134 132 166
    L 68 166
    Q 84 134 86 114
    Q 66 116 34 132
    L 34 68
    Q 66 84 86 86
    Q 84 66 68 34 Z"/>

  <!-- Initials. A serif stack keeps the letterforms close to the original
       wherever the file is rendered. -->
  <g fill="#0d0d0d" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif"
     font-size="34" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="62" y="62">S</text>
    <text x="138" y="62">S</text>
    <text x="62" y="139">R</text>
    <text x="138" y="139">S</text>
  </g>
</svg>
